name: CI/CD

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ACR_NAME: fcgcarolina
  IMAGE_NAME: fcgcarolina.azurecr.io/catalogo-api
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # O SDK 10 é necessário para ler o .slnx; o 8.0 fornece o runtime dos testes.
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Detectar projetos de teste
        id: tests
        run: |
          if grep -rlq --include='*.csproj' '<IsTestProject>true</IsTestProject>' .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nenhum projeto de testes encontrado; etapa de testes ignorada."
          fi

      - name: Test
        if: steps.tests.outputs.found == 'true'
        run: dotnet test --configuration Release --no-build

      - name: Build da imagem Docker
        run: docker build --pull --tag "$IMAGE_NAME:$IMAGE_TAG" .

      - name: Trivy (HIGH e CRITICAL com correção disponível)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # O job de publicação roda em outro runner; passar a imagem escaneada garante que o que sobe é o que foi verificado.
      - name: Salvar a imagem
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: docker save "$IMAGE_NAME:$IMAGE_TAG" | gzip > image.tar.gz

      - name: Publicar a imagem como artefato
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar.gz
          retention-days: 1

  publish:
    needs: build-test-scan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image

      - name: Carregar a imagem
        run: docker load --input image.tar.gz

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login no ACR
        run: az acr login --name "$ACR_NAME"

      - name: Push da imagem
        run: docker push "$IMAGE_NAME:$IMAGE_TAG"

  # TODO: este job entra quando o AKS existir.
  deploy:
    if: false
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploy no AKS ainda não implementado."
